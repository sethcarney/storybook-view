name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # Install only the extension's own workspace. This skips the test-apps
      # workspaces entirely, whose native bindings (e.g. Vite/rolldown platform
      # packages) are unnecessary here and a flaky source of CI failures.
      #
      # Do not use --omit=optional for this: some toolchain packages ship their
      # platform binary as an optional dependency, so omitting them globally
      # leaves the tools unable to run.
      - name: Install dependencies
        run: bun install --filter storybook-view

      - name: Compile TypeScript
        run: bun run compile

      - name: Lint
        run: bun run lint

  test:
    name: Extension Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # See note in the build job: the test-apps workspaces are unnecessary for
      # the extension test run and cause flaky install failures.
      - name: Install dependencies
        run: bun install --filter storybook-view

      - name: Compile TypeScript
        run: bun run compile

      - name: Install xvfb
        run: sudo apt-get install -y xvfb

      - name: Run extension tests
        run: xvfb-run -a node ./out/test/runTest.js
        env:
          DISPLAY: ':99.0'
